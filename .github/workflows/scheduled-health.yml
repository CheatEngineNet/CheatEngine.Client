# Advisory scheduled health, never part of CI / Gate (eng/ci/Invoke-ScheduledHealth.ps1 does the work; the canary
# first points global.json at the newest SDK with eng/ci/Select-NewestDotNetSdk.ps1).
# - Weekly: strict NuGet audit over a fresh package folder, newest .NET 10 SDK canary (lock-file patch artifact) and
#   the repeat run.
# - Daily: repeat run of the threading-sensitive test modules (flaky-test policy: no automatic retries anywhere).
# - A failed scheduled run opens, or comments on, one "Scheduled health failed" issue.
# Schedules and workflow_dispatch run from the default branch only, and GitHub disables schedules after 60 days without
# repository activity. Before merge, a maintainer adds the 'dry-run' label to a pull request to run every job once.
# The NuGet cache stays off here too: the audit and the canary must download and hash-check every package.
name: Scheduled health

on:
  schedule:
    - cron: '17 3 * * 1' # weekly: audit + canary + repeat
    - cron: '47 2 * * *' # daily: repeat only
  workflow_dispatch:
  pull_request:
    types: [ labeled ]

# The label name keeps a pending 'dry-run' run from being replaced by the run of any other label added later.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  audit:
    name: Strict NuGet audit
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '17 3 * * 1'
      || (github.event_name == 'pull_request' && github.event.label.name == 'dry-run')
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet
        with:
          cache: 'false'

      - name: Audit every package (every NuGet audit code is an error)
        run: ./eng/ci/Invoke-ScheduledHealth.ps1 -Mode Audit

  canary:
    name: Newest .NET 10 SDK canary
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '17 3 * * 1'
      || (github.event_name == 'pull_request' && github.event.label.name == 'dry-run')
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer and the package-consumption tests need the tag history
          persist-credentials: false

      # Before the composite action, so that it installs exactly the SDK the rewritten global.json names. The script
      # never runs the .NET CLI (no SDK exists yet); it moves sdk.version and the version named by sdk.errorMessage
      # and keeps every other byte of global.json, including the test runner section.
      - name: Point global.json at the newest 10.0 SDK
        run: ./eng/ci/Select-NewestDotNetSdk.ps1

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet
        with:
          cache: 'false'

      - name: Regenerate lock files, build, pack and test
        run: ./eng/ci/Invoke-ScheduledHealth.ps1 -Mode Canary

      - name: Upload the global.json and lock-file patch
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-canary-patch
          path: artifacts/health/sdk-canary.patch
          if-no-files-found: ignore
          retention-days: 30

  repeat:
    name: Repeat threading-sensitive tests
    if: github.event_name != 'pull_request' || github.event.label.name == 'dry-run'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET and restore (locked)
        uses: ./.github/actions/setup-dotnet
        with:
          restore: CheatEngine.Client.slnx
          cache: 'false'

      - name: Run the modules five times
        run: ./eng/ci/Invoke-ScheduledHealth.ps1 -Mode Repeat -Iterations 5

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-repeat-results
          path: artifacts/health/repeat/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Report scheduled failures
    needs: [ audit, canary, repeat ]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the single failure issue
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $needs = $env:NEEDS | ConvertFrom-Json -AsHashtable
          $failed = @($needs.Keys | Where-Object { $needs[$_].result -ceq 'failure' } | Sort-Object)
          $title = 'Scheduled health failed'
          $open = gh issue list --state open --label ci --limit 100 --json number,title | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "gh issue list failed with exit code $LASTEXITCODE."
          }
          $existing = @($open | Where-Object { $_.title -ceq $title } | Select-Object -First 1)
          $body = "Failed jobs: $($failed -join ', '). Run: $env:RUN_URL"
          if ($existing.Count -eq 0) {
            gh issue create --title $title --label ci --body $body
          }
          else {
            gh issue comment $existing[0].number --body $body
          }
          if ($LASTEXITCODE -ne 0) {
            throw "gh issue create or comment failed with exit code $LASTEXITCODE."
          }

name: Main CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# No concurrency group: every main commit keeps its own complete run (a pending run in a group would be replaced by the
# next one).

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      sonar: true # ci.yml reports the quality gate on push and waits for it on manual runs
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

name: CI

# Reusable pipeline for pull-request-ci.yml, main-ci.yml and release.yml. Callers use the job id `ci` named `CI`, so
# the only required check is "CI / Gate".
#
#   build-test (Debug, Release) ─► sonar ─┐
#   aot ──────────────────────────────────┤
#   lint ─────────────────────────────────┤
#   format ───────────────────────────────┼─► gate
#   dependency-review ────────────────────┤
#   lock-files ───────────────────────────┘
#
# The Release leg packs before it tests: the package-consumption tests install the very files CI uploads. Jobs exchange
# artifacts instead of rebuilding (names reserved, nothing else is uploaded):
#   nuget-packages, build-info            build-test (Release) → sonar, release.yml
#   coverage                              build-test (Debug)   → sonar
#   coverage-report                       build-test (Debug)   → humans
#   test-results-<configuration>          build-test           → humans
#   test-dumps-<configuration>, binlogs-* on failure only      → humans
#
# No job here uses a NuGet cache: release.yml reaches every job.

on:
  workflow_call:
    inputs:
      sonar:
        description: Run the SonarQube Cloud analysis. Fork pull requests and Dependabot always skip it (SONAR_EXPECTED).
        type: boolean
        default: false
      package-version:
        description: When set (release), the Release leg must produce exactly <Id>.<package-version>.nupkg for every Client package.
        type: string
        default: ''
      package-retention-days:
        description: Days to keep the nuget-packages and build-info artifacts.
        type: number
        default: 7
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud analysis token. Needed only when sonar is true.
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build-test:
    name: Build and test (${{ matrix.configuration }})
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      RESULTS: artifacts/test-results/${{ matrix.configuration }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the package version comes from tags and history; build-info records the tree
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          restore: CheatEngine.Client.slnx

      # No --warnaserror: it would also promote the NuGet audit warnings replayed at build (NU1901/NU1902) and override
      # the audit policy. TreatWarningsAsErrors (Directory.Build.props) keeps compiler and analyzer strictness.
      - name: Build
        run: |
          dotnet build CheatEngine.Client.slnx -c $env:CONFIGURATION --no-restore "-bl:artifacts/logs/build-test-$env:CONFIGURATION.binlog"
          if ($LASTEXITCODE -ne 0) {
            throw "$env:CONFIGURATION solution build failed with exit code $LASTEXITCODE."
          }

      # Every .nupkg must embed its SPDX SBOM (_manifest/spdx_2.2/manifest.spdx.json): the pack generates it
      # unconditionally (eng/Shipping.props, eng/Templates.props) and release.yml attests it.
      - name: Pack
        id: pack
        if: matrix.configuration == 'Release'
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet pack CheatEngine.Client.slnx -c Release --no-build -o artifacts/nuget -bl:artifacts/logs/pack-Release.binlog
          if ($LASTEXITCODE -ne 0) {
            throw "Client package creation failed with exit code $LASTEXITCODE."
          }
          ./eng/ci/Test-PackageSet.ps1 -PackageDirectory artifacts/nuget -PackageVersion $env:PACKAGE_VERSION -RequireSbom

      - name: Write build info
        if: matrix.configuration == 'Release'
        env:
          RUNNER_LABEL: windows-2025
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./eng/ci/New-BuildInfo.ps1 -PackageDirectory artifacts/nuget -RunnerLabel $env:RUNNER_LABEL -PullRequestNumber $env:PR_NUMBER -PullRequestHeadSha $env:PR_HEAD_SHA

      # The solution build compiles the benchmarks; listing them proves discovery. Benchmarks never run in the Gate.
      - name: Benchmarks discovery
        if: matrix.configuration == 'Release'
        run: |
          $ErrorActionPreference = 'Stop'
          $listed = @(dotnet run --project tests/CheatEngine.Client.Benchmarks/CheatEngine.Client.Benchmarks.csproj -c Release --no-build -- --list flat --artifacts artifacts/benchmarks)
          if ($LASTEXITCODE -ne 0) {
            throw "Benchmark discovery failed with exit code $LASTEXITCODE."
          }
          $benchmarks = @($listed | Where-Object { $_ -match '^CheatEngine\.Client\.Benchmarks\.' })
          if ($benchmarks.Count -eq 0) {
            throw "The benchmark switcher listed no benchmark:`n$($listed -join "`n")"
          }
          "Discovered $($benchmarks.Count) benchmarks." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # One parallel run over every tests/**/*.Tests module. A skip fails the run (--fail-skips on). Debug collects one
      # coverage report per module and leaves the package-consumption tests to Release by trait filter, never Skip.
      # Release hands those tests the packages the Pack step produced. The hang dump fires after 15 minutes without
      # test activity, well below the job timeout.
      - name: Test
        env:
          PACKAGE_SOURCE: ${{ steps.pack.outputs.package-source }}
        run: |
          $ErrorActionPreference = 'Stop'
          $options = @(
            '--solution', 'CheatEngine.Client.slnx', '-c', $env:CONFIGURATION, '--no-build', '--results-directory', $env:RESULTS,
            '--fail-skips', 'on', '--report-trx', '--report-gh', '--report-gh-groups', 'off',
            '--hangdump', '--hangdump-timeout', '15m', '--crashdump'
          )
          if ($env:CONFIGURATION -eq 'Debug') {
            $options += '--coverage', '--coverage-output-format', 'xml', '--filter-not-trait', 'Category=PackageConsumption'
          }
          else {
            # Set only here: the smoke tests fail on a set-but-empty value, and the Debug leg has no packages.
            if ([string]::IsNullOrEmpty($env:PACKAGE_SOURCE)) {
              throw 'The Pack step exported no package-source.'
            }
            $env:CHEATENGINE_CLIENT_PACKAGE_SOURCE = $env:PACKAGE_SOURCE
          }
          dotnet test @options
          if ($LASTEXITCODE -ne 0) {
            throw "$env:CONFIGURATION tests failed with exit code $LASTEXITCODE."
          }

      - name: Test module inventory
        run: ./eng/ci/Test-TestModuleInventory.ps1 -ResultsDirectory $env:RESULTS -Configuration $env:CONFIGURATION -RequireCoverage:$($env:CONFIGURATION -eq 'Debug')

      - name: Coverage ratchet
        if: matrix.configuration == 'Debug'
        run: ./eng/ci/Test-CoverageBaseline.ps1 -ResultsDirectory $env:RESULTS -Baseline eng/coverage-baseline.json -OutputDirectory artifacts/coverage-report

      - name: Upload packages
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error
          retention-days: ${{ inputs.package-retention-days }}

      - name: Upload build info
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-info
          path: artifacts/build-info/build-info.json
          if-no-files-found: error
          retention-days: ${{ inputs.package-retention-days }}

      - name: Upload coverage
        if: matrix.configuration == 'Debug'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: ${{ env.RESULTS }}/*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage report
        if: ${{ !cancelled() && matrix.configuration == 'Debug' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: artifacts/coverage-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.configuration }}
          path: ${{ env.RESULTS }}/*.trx
          if-no-files-found: warn
          retention-days: 7

      # Crash dumps, hang dumps and the test sequence logs that name the tests running at the time.
      - name: Upload test dumps
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-dumps-${{ matrix.configuration }}
          path: |
            ${{ env.RESULTS }}/**/*.dmp
            ${{ env.RESULTS }}/**/*.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload binary logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binlogs-build-test-${{ matrix.configuration }}
          path: artifacts/logs/*.binlog
          if-no-files-found: ignore
          retention-days: 5

  # A trim and Native AOT graph probe only: it never loads anything into Cheat Engine.
  aot:
    name: Native AOT publication probe
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the package version comes from tags and history
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          restore: tests/CheatEngine.Client.AotProbe/CheatEngine.Client.AotProbe.csproj

      # The project pins its RuntimeIdentifier (win-x64), so publish needs no --runtime.
      - name: Publish and run Native AOT probe
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD 'artifacts/aot-probe'
          dotnet publish tests/CheatEngine.Client.AotProbe/CheatEngine.Client.AotProbe.csproj -c Release --no-restore -o $output -bl:artifacts/logs/aot-publish.binlog
          if ($LASTEXITCODE -ne 0) {
            throw "Native AOT probe publish failed with exit code $LASTEXITCODE."
          }
          $probe = Join-Path $output 'CheatEngine.Client.AotProbe.exe'
          if (-not (Test-Path -LiteralPath $probe -PathType Leaf)) {
            throw "Native AOT publish did not produce '$probe'."
          }
          & $probe
          if ($LASTEXITCODE -ne 0) {
            throw "Native AOT probe exited with code $LASTEXITCODE."
          }

      - name: Upload binary logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binlogs-aot
          path: artifacts/logs/*.binlog
          if-no-files-found: ignore
          retention-days: 5

  # Pull requests fail on the quality gate; main only reports it. SONAR_EXPECTED below must stay identical to the gate's.
  sonar:
    name: Sonar
    needs: build-test
    if: >-
      inputs.sonar
      && github.event_name != 'merge_group'
      && github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/sonar.yml
    with:
      wait-quality-gate: ${{ github.event_name != 'push' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # linux_amd64, official checksums file
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'actionlint.tar.gz'
          $url = "https://github.com/rhysd/actionlint/releases/download/v$env:ACTIONLINT_VERSION/actionlint_$($env:ACTIONLINT_VERSION)_linux_amd64.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ACTIONLINT_SHA256) {
            throw "actionlint $env:ACTIONLINT_VERSION has SHA-256 $actual, expected $env:ACTIONLINT_SHA256."
          }
          tar -xzf $archive -C $env:RUNNER_TEMP actionlint
          if ($LASTEXITCODE -ne 0) {
            throw "Extracting actionlint failed with exit code $LASTEXITCODE."
          }
          & (Join-Path $env:RUNNER_TEMP 'actionlint') -color
          if ($LASTEXITCODE -ne 0) {
            throw "actionlint failed with exit code $LASTEXITCODE."
          }

      # Offline audits only, so the result depends on the commit alone; the online audits run in zizmor-online.yml.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          online-audits: false
          advanced-security: false
          config: .github/zizmor.yml

      - name: Analyse PowerShell scripts
        run: ./eng/ci/Invoke-ScriptAnalysis.ps1 -ModuleDirectory (Join-Path $env:RUNNER_TEMP 'PSScriptAnalyzer')

  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      # Whitespace needs no restore or MSBuild workspace, and the CRLF checkout (.gitattributes) matches .editorconfig.
      # Style rules are enforced by the build (EnforceCodeStyleInBuild).
      - name: Verify whitespace formatting
        run: |
          dotnet format whitespace . --folder --verify-no-changes --exclude artifacts
          if ($LASTEXITCODE -ne 0) {
            throw "Whitespace formatting differs (exit code $LASTEXITCODE). Fix it with: dotnet format whitespace <path> --folder"
          }

  # Always runs, so the Gate never has to accept a skip: the review itself runs on pull requests only.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          comment-summary-in-pr: never

      - name: Nothing to review
        if: github.event_name != 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
        run: Write-Host "::notice title=Dependency review::Dependency review compares a pull request with its base; a $env:EVENT run has nothing to compare."

  lock-files:
    name: Lock files
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      # Windows only: Native AOT lock sections record host-RID ILCompiler packages.
      - name: Verify lock files
        run: ./eng/Update-LockFiles.ps1 -Verify

  gate:
    name: Gate
    # always(): a failed or cancelled job must turn the required check red instead of skipping it.
    if: always()
    needs: [ build-test, aot, sonar, lint, format, dependency-review, lock-files ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
          SONAR_EXPECTED: >-
            ${{ inputs.sonar
                && github.event_name != 'merge_group'
                && github.actor != 'dependabot[bot]'
                && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          EVENT: ${{ github.event_name }}
        run: |
          # Every job must succeed. Only sonar has a required result that depends on the event: success when
          # SONAR_EXPECTED is true, skipped otherwise (fork, Dependabot, release call). A sonar run that was not
          # expected means its condition drifted from SONAR_EXPECTED, which fails too.
          $ErrorActionPreference = 'Stop'
          $needs = $env:NEEDS | ConvertFrom-Json -AsHashtable
          $sonarExpected = $env:SONAR_EXPECTED -eq 'true'
          $failed = [Collections.Generic.List[string]]::new()
          $rows = foreach ($job in @($needs.Keys | Sort-Object)) {
            $result = $needs[$job].result
            $required = 'success'
            $reason = 'every job must succeed'
            if ($job -eq 'sonar') {
              if ($sonarExpected) {
                $reason = 'SONAR_EXPECTED=true'
                if ($result -eq 'skipped' -and $needs['build-test'].result -ne 'success') {
                  $reason = 'SONAR_EXPECTED=true; skipped because build-test did not succeed'
                }
              }
              else {
                $required = 'skipped'
                $reason = "SONAR_EXPECTED=false ($env:EVENT run: fork, Dependabot or release call)"
              }
            }
            if ($result -ne $required) {
              $failed.Add("$job ($result, required $required)")
            }
            "| $job | $result | $required | $reason |"
          }
          @('### Gate', '', '| Job | Result | Required | Reason |', '| --- | --- | --- | --- |') + $rows |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($failed.Count -gt 0) {
            Write-Host "::error::Not as required: $($failed -join ', ')."
            exit 1
          }

name: Client validation

on:
  workflow_call:
    inputs:
      collect_sonar_coverage:
        description: Produce Microsoft XML coverage reports consumed by the guarded Sonar job.
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud token for protected same-repository analysis.
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MSBUILDDISABLENODEREUSE: true

jobs:
  validate:
    name: Validate packages, template, and AOT graph
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Restore locked dependency graph
        run: |
          dotnet restore CheatEngine.Client.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed with exit code $LASTEXITCODE."
          }

      - name: Build Release
        run: |
          dotnet build CheatEngine.Client.slnx --configuration Release --no-restore --warnaserror
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet build failed with exit code $LASTEXITCODE."
          }

      - name: Pack and validate public package APIs
        run: |
          dotnet pack CheatEngine.Client.slnx --configuration Release --no-build --no-restore --output artifacts/packages
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet pack failed with exit code $LASTEXITCODE."
          }

      - name: Run unit tests through Microsoft Testing Platform
        env:
          COLLECT_SONAR_COVERAGE: ${{ inputs.collect_sonar_coverage }}
          CHEATENGINE_CLIENT_PACKAGE_SOURCE: ${{ github.workspace }}/artifacts/packages
        run: |
          $projects = @(Get-ChildItem -Path tests -Filter '*.Tests.csproj' -Recurse -File | Sort-Object Name)
          if ($projects.Count -eq 0) {
            throw 'No *.Tests.csproj project found under tests.'
          }

          foreach ($project in $projects) {
            $results = Join-Path 'artifacts/test-results' $project.BaseName
            $options = @(
              '--project', $project.FullName,
              '--configuration', 'Release',
              '--no-build', '--no-restore',
              '--report-trx',
              '--results-directory', $results,
              '--fail-skips', 'on'
            )

            if ($env:COLLECT_SONAR_COVERAGE -eq 'true') {
              $coverage = [IO.Path]::GetFullPath((Join-Path (Join-Path 'artifacts/sonar-test-results' $project.BaseName) 'coverage.xml'))
              $options += @(
                '--coverage',
                '--coverage-output', $coverage,
                '--coverage-output-format', 'xml'
              )
            }

            dotnet test @options
            if ($LASTEXITCODE -ne 0) {
              throw "Microsoft Testing Platform failed for '$($project.FullName)' with exit code $LASTEXITCODE."
            }
          }

      - name: Verify Sonar coverage reports
        if: ${{ inputs.collect_sonar_coverage && !cancelled() }}
        run: |
          $projects = @(Get-ChildItem -Path tests -Filter '*.Tests.csproj' -Recurse -File)
          $reports = @($projects | ForEach-Object {
            Join-Path (Join-Path 'artifacts/sonar-test-results' $_.BaseName) 'coverage.xml'
          })
          $missingReports = @($reports | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missingReports.Count -gt 0) {
            throw "Microsoft Testing Platform did not produce XML coverage report(s): $($missingReports -join ', ')."
          }

          foreach ($report in $reports) {
            if ((Get-Item -LiteralPath $report).Length -eq 0) {
              throw "Coverage report '$report' is empty."
            }

            try {
              $coverage = [xml](Get-Content -LiteralPath $report -Raw)
            }
            catch {
              throw "Coverage report '$report' is not valid XML. $($_.Exception.Message)"
            }

            if ($null -eq $coverage.DocumentElement) {
              throw "Coverage report '$report' has no XML document element."
            }
          }

          Write-Host "Verified $($reports.Count) non-empty XML coverage report(s)."

      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: |
          $reports = @(Get-ChildItem -Path artifacts/test-results -Filter *.trx -Recurse -File -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            throw 'Microsoft Testing Platform did not produce a TRX test report.'
          }

          $results = @($reports | ForEach-Object {
            ([xml](Get-Content -LiteralPath $_.FullName -Raw)).TestRun.Results.UnitTestResult
          } | Where-Object { $_ })
          $passed = @($results | Where-Object outcome -eq 'Passed').Count
          $skipped = @($results | Where-Object outcome -eq 'NotExecuted').Count
          $failed = @($results | Where-Object { $_.outcome -notin 'Passed', 'NotExecuted' })

          @(
            '### Test results',
            '',
            '| Total | Passed | Failed | Skipped |',
            '| ---: | ---: | ---: | ---: |',
            "| $($results.Count) | $passed | $($failed.Count) | $skipped |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Sonar coverage reports
        if: ${{ inputs.collect_sonar_coverage && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-coverage
          path: artifacts/sonar-test-results/*/coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

      - name: Publish Native AOT reference probe
        run: |
          dotnet publish tests/CheatEngine.Client.AotProbe/CheatEngine.Client.AotProbe.csproj --configuration Release --runtime win-x64 --no-restore --output ./artifacts/aot-probe
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

      - name: Run Native AOT reference probe
        run: |
          ./artifacts/aot-probe/CheatEngine.Client.AotProbe.exe
          if ($LASTEXITCODE -ne 0) {
            throw "The Native AOT reference probe failed with exit code $LASTEXITCODE."
          }

      - name: Upload Native AOT probe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-aot-probe
          path: artifacts/aot-probe
          if-no-files-found: warn
          retention-days: 14

  sonar:
    name: Sonar
    needs: validate
    if: ${{ inputs.collect_sonar_coverage }}
    uses: ./.github/workflows/sonar.yml
    with:
      ci_based_analysis: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  lint-workflows:
    name: Lint workflows
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9
    steps:
      - name: Checkout workflow definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Run actionlint
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'actionlint.zip'
          $url = "https://github.com/rhysd/actionlint/releases/download/v$env:ACTIONLINT_VERSION/actionlint_$($env:ACTIONLINT_VERSION)_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ACTIONLINT_SHA256) {
            throw "actionlint $env:ACTIONLINT_VERSION has SHA-256 $actual, expected $env:ACTIONLINT_SHA256."
          }
          $destination = Join-Path $env:RUNNER_TEMP 'actionlint'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          & (Join-Path $destination 'actionlint.exe') -color
          if ($LASTEXITCODE -ne 0) {
            throw "actionlint failed with exit code $LASTEXITCODE."
          }

  gate:
    name: Gate
    if: ${{ always() }}
    needs: [validate, sonar, dependency-review, lint-workflows]
    runs-on: windows-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Check required results
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          SONAR_REQUIRED: ${{ inputs.collect_sonar_coverage }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          LINT_RESULT: ${{ needs.lint-workflows.result }}
        run: |
          $results = [ordered]@{
            validate = $env:VALIDATE_RESULT
            sonar = $env:SONAR_RESULT
            'dependency-review' = $env:DEPENDENCY_RESULT
            'lint-workflows' = $env:LINT_RESULT
          }
          $rows = $results.GetEnumerator() | ForEach-Object { "| $($_.Key) | $($_.Value) |" }
          '| Job | Result |', '| --- | --- |', $rows | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $failed = @($results.GetEnumerator() | Where-Object {
            $_.Key -eq 'validate' -and $_.Value -ne 'success' -or
            $_.Key -eq 'sonar' -and $env:SONAR_REQUIRED -eq 'true' -and $_.Value -ne 'success' -or
            $_.Key -in 'dependency-review', 'lint-workflows' -and $_.Value -ne 'success'
          } | ForEach-Object Key)
          if ($failed.Count -gt 0) {
            Write-Host "::error::Required job(s) did not succeed: $($failed -join ', ')."
            exit 1
          }

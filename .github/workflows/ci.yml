name: Client validation

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MSBUILDDISABLENODEREUSE: true

jobs:
  validate:
    name: Validate packages, template, and AOT graph
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Validate engineering backlog and validator tests
        run: |
          python --version
          python eng/Validate-EngineeringManifest.py
          python -m unittest discover -s eng/tests -v

      - name: Restore locked dependency graph
        run: dotnet restore CheatEngine.Client.slnx --locked-mode

      - name: Build Release
        run: dotnet build CheatEngine.Client.slnx --configuration Release --no-restore --warnaserror

      - name: Run unit tests through Microsoft Testing Platform
        run: |
          $projects = @(Get-ChildItem -Path tests -Filter '*.Tests.csproj' -Recurse -File | Sort-Object Name)
          if ($projects.Count -eq 0) {
            throw 'No *.Tests.csproj project found under tests.'
          }

          foreach ($project in $projects) {
            $results = Join-Path 'artifacts/test-results' $project.BaseName
            $options = @(
              '--project', $project.FullName,
              '--configuration', 'Release',
              '--no-build', '--no-restore',
              '--report-trx',
              '--results-directory', $results,
              '--fail-skips', 'on'
            )
            dotnet test @options
          }

      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: |
          $reports = @(Get-ChildItem -Path artifacts/test-results -Filter *.trx -Recurse -File -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            throw 'Microsoft Testing Platform did not produce a TRX test report.'
          }

          $results = @($reports | ForEach-Object {
            ([xml](Get-Content -LiteralPath $_.FullName -Raw)).TestRun.Results.UnitTestResult
          } | Where-Object { $_ })
          $passed = @($results | Where-Object outcome -eq 'Passed').Count
          $skipped = @($results | Where-Object outcome -eq 'NotExecuted').Count
          $failed = @($results | Where-Object { $_.outcome -notin 'Passed', 'NotExecuted' })

          @(
            '### Test results',
            '',
            '| Total | Passed | Failed | Skipped |',
            '| ---: | ---: | ---: | ---: |',
            "| $($results.Count) | $passed | $($failed.Count) | $skipped |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Pack and validate public package APIs
        run: dotnet pack CheatEngine.Client.slnx --configuration Release --no-build --no-restore

      - name: Smoke test isolated package consumption
        shell: pwsh
        run: ./eng/Invoke-PackageSmoke.ps1 -PackageSource ./artifacts/packages

      - name: Smoke test local template installation
        run: ./eng/Invoke-TemplateSmoke.ps1 -PackageSource ./artifacts/packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

      - name: Publish Native AOT reference probe
        run: dotnet publish tests/CheatEngine.Client.AotProbe/CheatEngine.Client.AotProbe.csproj --configuration Release --runtime win-x64 --no-restore --output ./artifacts/aot-probe

      - name: Run Native AOT reference probe
        run: ./artifacts/aot-probe/CheatEngine.Client.AotProbe.exe

      - name: Upload Native AOT probe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-aot-probe
          path: artifacts/aot-probe
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Gate
    if: ${{ always() }}
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Check validation result
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          "| Job | Result |", "| --- | --- |", "| validate | $env:VALIDATE_RESULT |" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($env:VALIDATE_RESULT -ne 'success') {
            Write-Host "::error::Validation finished with '$env:VALIDATE_RESULT'."
            exit 1
          }

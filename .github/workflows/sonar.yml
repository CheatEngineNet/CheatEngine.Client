name: Sonar

on:
  workflow_call:
    inputs:
      project-key:
        description: SonarQube Cloud project key.
        type: string
        default: CheatEngineNet_CheatEngine.Client
      organization:
        description: SonarQube Cloud organization key.
        type: string
        default: cheatenginenet
      wait-quality-gate:
        description: Fail the analysis job when SonarQube Cloud reports a failing Quality Gate.
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud token. Analysis is skipped when it is unavailable.
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MSBUILDDISABLENODEREUSE: true
  SONAR_SCANNER_VERSION: 11.3.0

jobs:
  analyze:
    name: Analyze
    if: github.event_name != 'merge_group'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}
      SONAR_PROJECT_KEY: ${{ inputs.project-key }}
      SONAR_ORGANIZATION: ${{ inputs.organization }}
      SONAR_WAIT_QUALITY_GATE: ${{ inputs.wait-quality-gate }}

    steps:
      - name: Skip without token
        if: env.SONAR_ENABLED != 'true'
        run: >-
          Write-Host '::notice title=Sonar analysis skipped::SONAR_TOKEN is empty. Fork and Dependabot pull requests
          receive no repository secret; configure SONAR_TOKEN to enable analysis.'

      - name: Check analysis method
        if: env.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $uri = "https://sonarcloud.io/api/settings/values?component=$env:SONAR_PROJECT_KEY&keys=sonar.autoscan.enabled"
          try {
            $response = Invoke-RestMethod -Uri $uri -Headers @{ Authorization = "Bearer $env:SONAR_TOKEN" } `
              -TimeoutSec 30 -MaximumRetryCount 2 -RetryIntervalSec 3
          }
          catch {
            Write-Host "::warning::Could not read the analysis method of $env:SONAR_PROJECT_KEY. $($_.Exception.Message)"
            return
          }

          if (@($response.settings | Where-Object { $_.key -eq 'sonar.autoscan.enabled' -and $_.value -eq 'true' })) {
            Write-Host "::error::Automatic Analysis is enabled on $env:SONAR_PROJECT_KEY, so SonarQube Cloud rejects CI analysis. Turn it off in Administration, Analysis Method."
            exit 1
          }

      - name: Checkout
        if: env.SONAR_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        if: env.SONAR_ENABLED == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Install pinned .NET SDK
        if: env.SONAR_ENABLED == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Download coverage
        if: env.SONAR_ENABLED == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-client
          path: ${{ runner.temp }}/coverage

      - name: Install scanner
        if: env.SONAR_ENABLED == 'true'
        run: >-
          dotnet tool install dotnet-sonarscanner --tool-path "$env:RUNNER_TEMP/sonar-scanner"
          --version $env:SONAR_SCANNER_VERSION

      - name: Restore locked dependency graph
        if: env.SONAR_ENABLED == 'true'
        run: dotnet restore CheatEngine.Client.slnx --locked-mode

      - name: Begin analysis
        if: env.SONAR_ENABLED == 'true'
        env:
          SONARQUBE_SCANNER_PARAMS: '{"sonar.token":"${{ secrets.SONAR_TOKEN }}"}'
        run: |
          $coverage = "$env:RUNNER_TEMP/coverage"
          $reports = @(Get-ChildItem -Path $coverage -Filter *.xml -Recurse -File -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            Write-Host '::error::No coverage report was downloaded. Call ci.yml with collect-coverage set to true.'
            exit 1
          }

          Write-Host "Coverage reports: $($reports.Count)"
          $arguments = @(
            "/k:$env:SONAR_PROJECT_KEY",
            "/o:$env:SONAR_ORGANIZATION",
            '/d:sonar.exclusions=artifacts/**',
            '/d:sonar.coverage.exclusions=tests/**',
            "/d:sonar.cs.vscoveragexml.reportsPaths=$coverage/**/*.xml",
            "/d:sonar.qualitygate.wait=$env:SONAR_WAIT_QUALITY_GATE"
          )
          & "$env:RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner.exe" begin @arguments

      - name: Build
        if: env.SONAR_ENABLED == 'true'
        run: >-
          dotnet build CheatEngine.Client.slnx --configuration Release --no-restore --no-incremental
          --disable-build-servers --warnaserror

      - name: End analysis
        if: env.SONAR_ENABLED == 'true'
        env:
          SONARQUBE_SCANNER_PARAMS: '{"sonar.token":"${{ secrets.SONAR_TOKEN }}"}'
        run: '& "$env:RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner.exe" end'

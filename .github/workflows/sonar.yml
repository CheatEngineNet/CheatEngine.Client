name: Sonar

on:
  workflow_call:
    inputs:
      ci_based_analysis:
        description: Acknowledge that SonarQube Cloud Automatic Analysis is disabled for this project.
        required: false
        type: boolean
        default: true
      project-key:
        description: SonarQube Cloud project key.
        type: string
        default: CheatEngineNet_CheatEngine.Client
      organization:
        description: SonarQube Cloud organization key.
        type: string
        default: cheatenginenet
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud token for protected, same-repository analysis.
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MSBUILDDISABLENODEREUSE: true
  SONAR_SCANNER_VERSION: 11.3.0

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ inputs.project-key }}
      SONAR_ORGANIZATION: ${{ inputs.organization }}

    steps:
      # SonarQube Cloud has no supported API that reads a project's Automatic Analysis setting. The scanner begin
      # call below is the earliest authoritative service-side preflight and fails before restore/build if Automatic
      # Analysis was not disabled in the project's Administration > Analysis Method UI.
      - name: Preflight CI-based analysis
        env:
          CI_BASED_ANALYSIS: ${{ inputs.ci_based_analysis }}
        run: |
          if ($env:CI_BASED_ANALYSIS -ne 'true') {
            throw 'Sonar analysis requires CI-based analysis. Disable Automatic Analysis in SonarQube Cloud before enabling this workflow.'
          }

          $sonarUserHome = Join-Path $env:RUNNER_TEMP 'sonar-user-home'
          "SONAR_USER_HOME=$sonarUserHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          @(
            '### Sonar analysis mode',
            '',
            'CI-based analysis is enabled for this run. SonarQube Cloud Automatic Analysis must remain disabled for this project.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Require Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw 'SONAR_TOKEN is required when SONAR_CI_ENABLED is true.'
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          # This secret-bearing job restores only through the generated NuGet.Config below. It deliberately does not
          # restore a global package cache that another PR workflow could have populated.
          cache: false

      # Only main saves this cache. Internal PRs may restore a known main-branch analyzer cache but cannot publish one.
      - name: Restore Sonar analyzer cache
        id: sonar-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sonar-user-home/cache
          key: sonar-analyzers-${{ runner.os }}-${{ runner.arch }}-${{ env.SONAR_SCANNER_VERSION }}-v1

      - name: Download Sonar coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-coverage
          path: artifacts/sonar-test-results

      - name: Verify coverage reports
        run: |
          $projects = @(Get-ChildItem -Path tests -Filter '*.Tests.csproj' -Recurse -File)
          $reports = @($projects | ForEach-Object {
            Join-Path (Join-Path 'artifacts/sonar-test-results' $_.BaseName) 'coverage.xml'
          })
          $missingReports = @($reports | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missingReports.Count -gt 0) {
            throw "Missing Sonar XML coverage report(s): $($missingReports -join ', ')."
          }

          foreach ($report in $reports) {
            if ((Get-Item -LiteralPath $report).Length -eq 0) {
              throw "Coverage report '$report' is empty."
            }

            try {
              $coverage = [xml](Get-Content -LiteralPath $report -Raw)
            }
            catch {
              throw "Coverage report '$report' is not valid XML. $($_.Exception.Message)"
            }

            if ($null -eq $coverage.DocumentElement) {
              throw "Coverage report '$report' has no XML document element."
            }
          }

          Write-Host "Verified $($reports.Count) non-empty XML coverage report(s)."

      - name: Create isolated NuGet configuration
        id: isolated-nuget-config
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP 'sonar-nuget.config'
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          '@ | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM

          "path=$configPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install scanner from nuget.org only
        env:
          NUGET_CONFIG: ${{ steps.isolated-nuget-config.outputs.path }}
        run: |
          dotnet tool install dotnet-sonarscanner --tool-path "$env:RUNNER_TEMP/sonar-scanner" --version $env:SONAR_SCANNER_VERSION --configfile "$env:NUGET_CONFIG"
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet-sonarscanner installation failed with exit code $LASTEXITCODE."
          }

      - name: Begin analysis
        env:
          SONARQUBE_SCANNER_PARAMS: '{"sonar.token":"${{ secrets.SONAR_TOKEN }}"}'
        run: |
          # These findings conflict with deliberate repository contracts. Keep them in scanner configuration so the
          # source remains free of Sonar-only attributes and suppressions. Test projects are excluded explicitly below.
          $ignoredIssues = @(
            @{ Key = 'noLinq'; Rule = 'csharpsquid:S3267'; Resource = '**/*.cs' }
            @{ Key = 'unsafeInterop'; Rule = 'csharpsquid:S6640'; Resource = '**/*.cs' }
            @{ Key = 'nullableFlow'; Rule = 'csharpsquid:S8970'; Resource = '**/*.cs' }
            @{ Key = 'apiOverloadLayout'; Rule = 'csharpsquid:S4136'; Resource = 'libs/**' }
            @{ Key = 'generatorInstances'; Rule = 'csharpsquid:S2325'; Resource = 'source-generators/**' }
            @{ Key = 'emittedFragments'; Rule = 'csharpsquid:S1192'; Resource = 'source-generators/**' }
            @{ Key = 'generatorComments'; Rule = 'csharpsquid:S125'; Resource = 'source-generators/**' }
          )
          $arguments = @(
            "/k:$env:SONAR_PROJECT_KEY"
            "/o:$env:SONAR_ORGANIZATION"
            '/d:sonar.exclusions=artifacts/**,tests/CheatEngine.Client.Benchmarks/**'
            '/d:sonar.dotnet.excludeTestProjects=true'
            '/d:sonar.cs.vscoveragexml.reportsPaths=artifacts/sonar-test-results/*/coverage.xml'
            "/d:sonar.issue.ignore.multicriteria=$(($ignoredIssues.Key) -join ',')"
            '/d:sonar.qualitygate.wait=true'
            '/d:sonar.qualitygate.timeout=300'
          )
          foreach ($issue in $ignoredIssues) {
            $arguments += "/d:sonar.issue.ignore.multicriteria.$($issue.Key).ruleKey=$($issue.Rule)"
            $arguments += "/d:sonar.issue.ignore.multicriteria.$($issue.Key).resourceKey=$($issue.Resource)"
          }
          & "$env:RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner.exe" begin @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Sonar begin analysis failed with exit code $LASTEXITCODE."
          }

      - name: Restore locked dependency graph from nuget.org only
        env:
          NUGET_CONFIG: ${{ steps.isolated-nuget-config.outputs.path }}
        run: |
          dotnet restore CheatEngine.Client.slnx --locked-mode --configfile "$env:NUGET_CONFIG"
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed with exit code $LASTEXITCODE."
          }

      - name: Build
        run: |
          dotnet build CheatEngine.Client.slnx --configuration Release --no-restore --no-incremental --disable-build-servers
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet build failed with exit code $LASTEXITCODE."
          }

      - name: End analysis and wait for quality gate
        env:
          SONARQUBE_SCANNER_PARAMS: '{"sonar.token":"${{ secrets.SONAR_TOKEN }}"}'
        run: |
          & "$env:RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner.exe" end
          if ($LASTEXITCODE -ne 0) {
            throw "Sonar end analysis failed with exit code $LASTEXITCODE."
          }

      - name: Save Sonar analyzer cache from main
        if: >-
          ${{ success()
              && github.ref == 'refs/heads/main'
              && steps.sonar-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sonar-user-home/cache
          key: sonar-analyzers-${{ runner.os }}-${{ runner.arch }}-${{ env.SONAR_SCANNER_VERSION }}-v1
